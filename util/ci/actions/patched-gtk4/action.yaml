name: Prepare pinned patched GTK4 runtime
description: Restore or build the narrow GTK4 DSO overlay used by GnuCash CTest jobs
inputs:
  build-jobs:
    description: Maximum parallel GTK build jobs on a cache miss
    default: '3'
runs:
  using: composite
  steps:
    - name: Install GTK source-build dependencies
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../gtk4-overlay/prepare.sh" install-dependencies
    - name: Validate GTK overlay cache contracts
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../gtk4-overlay/self-test.sh"
    - name: Compute exact GTK cache fingerprint
      id: fingerprint
      shell: bash
      run: |
        key="$(bash "$GITHUB_ACTION_PATH/../../gtk4-overlay/prepare.sh" fingerprint)"
        printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
    - name: Restore exact GTK runtime cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/gnucash-gtk4-overlay
        key: gnucash-gtk4-overlay-${{ steps.fingerprint.outputs.key }}
    - name: Validate or build the GTK runtime overlay
      shell: bash
      env:
        GNC_GTK4_CACHE_ROOT: ${{ runner.temp }}/gnucash-gtk4-overlay
        GTK4_OVERLAY_JOBS: ${{ inputs.build-jobs }}
      run: bash "$GITHUB_ACTION_PATH/../../gtk4-overlay/prepare.sh" prepare
    - name: Save exact GTK runtime cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/gnucash-gtk4-overlay
        key: gnucash-gtk4-overlay-${{ steps.fingerprint.outputs.key }}
