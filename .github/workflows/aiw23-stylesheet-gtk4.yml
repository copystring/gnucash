name: AIW23 GTK4 stylesheet review verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gtk4-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y cmake ninja-build gcc gcc-c++ pkgconf-pkg-config git glib2-devel gtk4-devel webkitgtk6.0-devel libxml2-devel libxslt-devel libicu-devel gettext-devel boost-devel swig guile30-devel gmp-devel mpfr-devel libffi-devel libdbi-devel libdbi-dbd-sqlite gtest-devel gmock-devel python3-devel gdb zlib-devel libsecret-devel xvfb-run xorg-x11-server-Xvfb dbus-daemon
      - name: Check stylesheet database ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('gnucash/gnome/dialog-report-style-sheet.cpp').read_text()
          start = s.index('gnc_style_sheet_options_close_cb')
          end = s.index('static ss_info *', start)
          cleanup = s[start:end]
          assert 'gnc_option_db_destroy' not in cleanup
          assert cleanup.index('delete ssi->odialog') < cleanup.index('scm_gc_unprotect_object (ssi->stylesheet)')
          assert 'g_free (ssi)' in cleanup
          print('Borrowed option database is not destroyed; editor and Scheme reference cleanup remain')
          PY
      - name: Configure GTK4
        run: cmake -S . -B build -GNinja -DWITH_GTK4=ON -DWITH_AQBANKING=OFF -DWITH_OFX=OFF -DWITH_PYTHON=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build report test target and runtime modules
        run: |
          cmake --build build --parallel 2
          cmake --build build --parallel 2 --target test-invoice-report-builtin-default test-stylesheet-close-ownership
      - name: Run report test
        run: xvfb-run -a dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error -R '^test-(invoice-report-builtin-default|stylesheet-close-ownership)$'

      - name: Diagnose stylesheet failure
        if: failure()
        run: |
          xvfb-run -a dbus-run-session -- ctest --test-dir build -V -R '^test-stylesheet-close-ownership$' --overwrite MemoryCheckCommandOptions='' || true
          GNC_UNINSTALLED=YES GNC_BUILDDIR=$PWD/build GNC_MODULE_PATH=$PWD/build/lib64:$PWD/build/lib64/gnucash GUILE_LOAD_PATH=$PWD/build/share/guile/site/3.0:$PWD/build/share/guile/site/3.0/gnucash/deprecated GUILE_LOAD_COMPILED_PATH=$PWD/build/lib64/guile/3.0/site-ccache:$PWD/build/lib64/guile/3.0/site-ccache/gnucash/deprecated LD_LIBRARY_PATH=$PWD/build/lib64:$PWD/build/lib64/gnucash GSETTINGS_SCHEMA_DIR=$PWD/build/share/glib-2.0/schemas GSETTINGS_BACKEND=memory GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- gdb -batch -ex run -ex 'thread apply all bt' --args build/bin/test-stylesheet-close-ownership || true
