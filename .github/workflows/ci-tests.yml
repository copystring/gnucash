name: ci-tests
on: [push, pull_request]
permissions: {}
jobs:
  ci_tests_ubuntu-22:
    runs-on: ubuntu-26.04
    name: Ubuntu-26.04 CI Tests
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: sudo apt-get update
      - name: Install additional dependencies
        run: sudo apt-get install -y gettext cmake libxslt-dev xsltproc ninja-build libboost-all-dev libgtk-4-dev guile-2.2-dev libofx-dev libdbi-dev libdbd-sqlite3 libwebkitgtk-6.0-dev googletest python3-dev swig
      - name: Install language packs.
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: |
          echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create Directories
        run: |
          pwd
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash without AqBanking
        run: |
          cd build
          # Ubuntu doesn't yet provide the required gwengui-gtk4 package.
          cmake -G Ninja -DWITH_PYTHON=ON -DWITH_AQBANKING=OFF -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst $GITHUB_WORKSPACE
      - name: Validate GTK4 builder resources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' resource; do
            gtk4-builder-tool validate "$resource"
          done < <(find "$GITHUB_WORKSPACE/gnucash" -type f \( -name '*.ui' -o -name '*.glade' \) -print0)
      - name: Build and Test GnuCash
        run: |
          cd build
          ninja
          ninja distcheck
        env:
          CTEST_OUTPUT_ON_FAILURE: On
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestLog
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
  ci_tests_ASAN:
    runs-on: ubuntu-26.04
    name: Address Sanitizer CI Tests
    continue-on-error: true
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: sudo apt-get update
      - name: Install additional dependencies
        run: sudo apt-get install -y gettext cmake libxslt-dev xsltproc ninja-build libboost-all-dev libgtk-4-dev guile-2.2-dev libofx-dev libdbi-dev libdbd-sqlite3 libwebkitgtk-6.0-dev googletest python3-dev swig
      - name: Install language packs.
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: |
          echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create Directories
        run: |
          pwd
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash without AqBanking
        run: |
          cd build
          # Ubuntu doesn't yet provide the required gwengui-gtk4 package.
          cmake -G Ninja -DWITH_PYTHON=ON -DWITH_AQBANKING=OFF -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Asan
      - name: Validate GTK4 builder resources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' resource; do
            gtk4-builder-tool validate "$resource"
          done < <(find "$GITHUB_WORKSPACE/gnucash" -type f \( -name '*.ui' -o -name '*.glade' \) -print0)
      - name: Build and Test GnuCash
        run: |
          cd build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: On
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestLog
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
