name: mac-gtk4-tests
on: [push, pull_request]
permissions: {}
jobs:
  ci_tests_mac_gtk4:
    runs-on: macos-14
    name: macOS-14 GTK4 CI Tests
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Environment
        run: |
          echo "PATH=$HOME/gnucash/inst/bin:$(brew --prefix gettext)/bin:$PATH" >> $GITHUB_ENV
          echo "PREFIX=$HOME/gnucash/inst" >> $GITHUB_ENV
          echo "SRCROOT=$HOME/gnucash/source" >> $GITHUB_ENV
          brew install ninja cmake pkg-config gettext gtk4 guile libofx libdbi sqlite googletest boost gtksourceview5 autoconf automake libtool libxmlsec1 gnutls libgcrypt gmp libxml2 swig icu4c
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxmlsec1)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$HOME/gnucash/inst/lib/pkgconfig" >> $GITHUB_ENV
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> $GITHUB_ENV
          echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix icu4c)/include -I$(brew --prefix)/include -I$(brew --prefix libgcrypt)/include -I$(brew --prefix gnutls)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix icu4c)/lib -L$(brew --prefix)/lib -L$(brew --prefix libgcrypt)/lib -L$(brew --prefix gnutls)/lib" >> $GITHUB_ENV
      - name: Build gwenhywfar-gtk4 from source (fork gtk4-backend)
        run: |
          mkdir -p $SRCROOT; cd $SRCROOT
          git clone --depth 1 --branch cs-202609-gtk4-gui https://github.com/copystring/gwenhywfar.git || \
            git clone --depth 1 --branch branch-4 https://github.com/aqbanking/gwenhywfar.git
          cd gwenhywfar
          sed -i.bak 's/case GWEN_DialogProperty_Title:/case GWEN_DialogProperty_Title: ;/' gui/gtk4/w_pushbutton.c || true
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          export ACLOCAL_PATH="$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal:${ACLOCAL_PATH:-}"
          export LIBTOOLIZE=glibtoolize
          export CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix libgcrypt)/include -I$(brew --prefix gnutls)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix libgcrypt)/lib -L$(brew --prefix gnutls)/lib"
          export CFLAGS="-std=gnu99 -g -O2 -Wno-error=declaration-after-statement"
          if [ ! -f configure ]; then autoreconf -fiv; fi
          ./configure --prefix=$PREFIX --with-guis="gtk4" --disable-binaries --disable-plugins --disable-network-checks --disable-binreloc
          make -j$(sysctl -n hw.ncpu)
          make install
      - name: Build aqbanking from source (against Gwenhywfar GTK4)
        run: |
          mkdir -p $SRCROOT; cd $SRCROOT
          curl --fail --location --show-error https://aquamaniac.de/rdm/attachments/download/654/aqbanking-6.9.2.tar.gz -o aqbanking-6.9.2.tar.gz
          tar -xf aqbanking-6.9.2.tar.gz
          cd aqbanking-6.9.2
          export CPPFLAGS="-I$PREFIX/include -I$(brew --prefix)/include -I$(brew --prefix gmp)/include -I$(brew --prefix libgcrypt)/include -I$(brew --prefix gnutls)/include"
          export LDFLAGS="-L$PREFIX/lib -L$(brew --prefix)/lib -L$(brew --prefix libgcrypt)/lib -L$(brew --prefix gnutls)/lib"
          export CFLAGS="-std=gnu99 -g -O2 -Wno-error=declaration-after-statement"
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxmlsec1)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH ./configure --prefix=$PREFIX --disable-static --enable-shared --enable-local-install
          make -j$(sysctl -n hw.ncpu)
          make install
      - name: Configure GnuCash for GTK4
        run: |
          mkdir -p $HOME/gnucash/build
          cd $HOME/gnucash/build
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$PKG_CONFIG_PATH" cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_PREFIX_PATH="$(brew --prefix icu4c);$(brew --prefix libxml2);$(brew --prefix);$PREFIX" \
            -DICU_ROOT="$(brew --prefix icu4c)" \
            -DCMAKE_C_FLAGS="-I$(brew --prefix icu4c)/include" \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix icu4c)/include" \
            -DWITH_PYTHON=ON \
            -DWITH_SQL=OFF \
            -DGTK_MIN_VERSION=4.10.0 \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash (GTK4)
        run: |
          cd $HOME/gnucash/build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: On
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestLog-mac-gtk4
          path: /Users/runner/gnucash/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore