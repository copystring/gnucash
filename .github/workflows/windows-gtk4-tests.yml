name: windows-gtk4-tests
on: [push, pull_request]
permissions: {}
jobs:
  ci_tests_windows_gtk4:
    runs-on: windows-latest
    name: Windows MSYS2 GTK4 CI Tests
    env:
      TZ: America/Los_Angeles
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
      - name: Add GnuCash custom repo
        run: |
          sed -i "/^# SigLevel = Never/a [gnc-ucrt64]\nSigLevel = Optional TrustAll\nServer = https://github.com/gnucash/gnucash-windows-deps-repo/releases/download/gnc-ucrt64-repo/" /etc/pacman.conf
          sed -i "s/^# ParallelDownloads/ParallelDownloads/" /etc/pacman.conf
          pacman -Syv
          pacboy --noconfirm -S swig:p appstream-glib:p aqbanking:p boost:p gtk4:p gsettings-desktop-schemas:p docbook-xsl:p gettext-tools:p gtest:p guile3:p harfbuzz-icu:p icu:p iso-codes:p pdcurses:p libdbi-drivers:p libofx:p libsecret:p webview2-loader zlib:p
      - name: Configure Environment
        run: |
          echo "PREFIX=$MSYSTEM_PREFIX" >> $GITHUB_ENV
          echo "GUILE_LOAD_PATH=$MSYSTEM_PREFIX/share/guile/3.0/" >> $GITHUB_ENV
          echo "GUILE_LOAD_COMPILED_PATH=$MSYSTEM_PREFIX/lib/guile/3.0/ccache" >> $GITHUB_ENV
      - name: Configure GnuCash for GTK4
        run: |
          mkdir -p build
          cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DWITH_PYTHON=ON \
            -DWITH_AQBANKING=ON \
            -DGTK_MIN_VERSION=4.10.0 \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash (GTK4)
        run: |
          cd build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: On
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestLog-windows-gtk4
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore