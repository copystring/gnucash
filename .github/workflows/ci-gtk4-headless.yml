name: ci-gtk4-headless
on: [push, pull_request]
permissions: {}
jobs:
  ci_gtk4_headless_ubuntu:
    runs-on: ubuntu-24.04
    name: Ubuntu-24.04 GTK4 Headless CI (Weston/Xvfb)
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: sudo apt-get update
      - name: Install GTK4 dependencies (base only — Gwenhywfar/AqBanking GTK4 built from source below)
        run: |
          sudo apt-get install -y \
            gettext cmake libxslt-dev xsltproc ninja-build \
            libboost-all-dev libgtk-4-dev \
            guile-3.0-dev \
            libofx-dev \
            libdbi-dev libdbd-sqlite3 \
            googletest \
            weston xvfb \
            wayland-protocols \
            autoconf automake libtool libgnutls28-dev libgcrypt20-dev libxmlsec1-dev \
            libpcsclite-dev libgmp-dev
      - name: Install language packs
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: |
          echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create Directories
        run: |
          pwd
          mkdir -p $ROOT_DIR/inst
          mkdir -p build
          echo "$ROOT_DIR/inst/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$ROOT_DIR/inst/lib/pkgconfig:$ROOT_DIR/inst/lib64/pkgconfig:$ROOT_DIR/inst/share/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROOT_DIR/inst/lib:$ROOT_DIR/inst/lib64" >> $GITHUB_ENV
          echo "ACLOCAL_PATH=$ROOT_DIR/inst/share/aclocal" >> $GITHUB_ENV
      - name: Build gwenhywfar-gtk4 from source (fork gtk4-backend)
        run: |
          cd $ROOT_DIR
          git clone --depth 1 --branch cs-202609-gtk4-gui https://github.com/copystring/gwenhywfar.git || \
            git clone --depth 1 --branch branch-4 https://github.com/aqbanking/gwenhywfar.git
          cd gwenhywfar
          if [ ! -f configure ]; then autoreconf -fiv; fi
          ./configure --prefix=$ROOT_DIR/inst --with-guis="gtk4" --disable-binaries --disable-plugins --disable-network-checks --disable-binreloc
          make -j$(nproc)
          make install
      - name: Build aqbanking from source (against Gwenhywfar GTK4)
        run: |
          cd $ROOT_DIR
          curl --fail --location --show-error https://aquamaniac.de/rdm/attachments/download/382/libchipcard-5.1.6.tar.gz -o libchipcard-5.1.6.tar.gz
          tar -xf libchipcard-5.1.6.tar.gz
          cd libchipcard-5.1.6
          PKG_CONFIG_PATH=$ROOT_DIR/inst/lib/pkgconfig:$ROOT_DIR/inst/lib64/pkgconfig:${PKG_CONFIG_PATH:-} ./configure --prefix=$ROOT_DIR/inst --disable-static --enable-shared
          make -j$(nproc)
          make install
          cd $ROOT_DIR
          curl --fail --location --show-error https://aquamaniac.de/rdm/attachments/download/654/aqbanking-6.9.2.tar.gz -o aqbanking-6.9.2.tar.gz
          tar -xf aqbanking-6.9.2.tar.gz
          cd aqbanking-6.9.2
          PKG_CONFIG_PATH=$ROOT_DIR/inst/lib/pkgconfig:$ROOT_DIR/inst/lib64/pkgconfig:${PKG_CONFIG_PATH:-} ./configure --prefix=$ROOT_DIR/inst --disable-static --enable-shared --enable-local-install
          make -j$(nproc)
          make install
      - name: Start Weston (headless Wayland compositor)
        run: |
          sudo mkdir -p /run/user/1000
          sudo chown $USER:$USER /run/user/1000
          weston --socket=wayland-0 --backend=headless --no-config &
          echo "WAYLAND_DISPLAY=wayland-0" >> $GITHUB_ENV
          sleep 2
      - name: Configure GnuCash for GTK4
        run: |
          cd build
          PKG_CONFIG_PATH=$ROOT_DIR/inst/lib/pkgconfig:$PKG_CONFIG_PATH cmake -G Ninja \
            -DWITH_PYTHON=ON \
            -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst \
            -DCMAKE_PREFIX_PATH=$ROOT_DIR/inst \
            -DGTK_MIN_VERSION=4.10.0 \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash (GTK4)
        run: |
          cd build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: On
          GDK_BACKEND: wayland
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestLog-gtk4-headless
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
      - name: Stop Weston
        if: always()
        run: pkill weston || true

